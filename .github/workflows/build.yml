name: Experimental coral OrangeFox
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coral-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-tree:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Import pinned upstream device tree once
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f coral/BoardConfig.mk ]]; then
            git remote add teamwin https://github.com/TeamWin/android_device_google_coral.git
            git fetch --depth=1 teamwin b3f760ee3d17805e895c0d6e0387fd59d1f39120
            git archive FETCH_HEAD | tar -x
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .
            git commit -m 'Import pinned TeamWin coral device tree with original notices'
            git push origin HEAD:main
          fi
  build:
    needs: import-tree
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop openjdk-11-jdk python3 rsync unzip zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name recovery-builder
          git config --global user.email recovery-builder@users.noreply.github.com
          # Give memory-heavy C++ links room without increasing build parallelism.
          coral_swap_file="$RUNNER_TEMP/orangefox-swap"
          sudo fallocate -l 8G "$coral_swap_file"
          sudo chmod 600 "$coral_swap_file"
          sudo mkswap "$coral_swap_file"
          sudo swapon "$coral_swap_file"
          free -h
          df -h
      - name: Sync and build boot recovery
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
        run: bash scripts/build.sh "$RUNNER_TEMP/orangefox"
      - name: Preserve logs even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coral-build-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
      - name: Upload structurally validated experimental image
        uses: actions/upload-artifact@v6
        with:
          name: OrangeFox-unofficial-coral-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
