name: Experimental coral OrangeFox
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coral-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import-tree:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Import pinned upstream device tree once
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f coral/BoardConfig.mk ]]; then
            git remote add teamwin https://github.com/TeamWin/android_device_google_coral.git
            git fetch --depth=1 teamwin b3f760ee3d17805e895c0d6e0387fd59d1f39120
            git archive FETCH_HEAD | tar -x
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .
            git commit -m 'Import pinned TeamWin coral device tree with original notices'
            git push origin HEAD:main
          fi
  kernel:
    name: Build and checkpoint kernel
    needs: import-tree
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Prepare build host
        run: bash scripts/prepare_host.sh
      - name: Build pinned kernel and DTBs
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
        run: bash scripts/build.sh "$RUNNER_TEMP/orangefox" kernel
      - name: Preserve completed kernel checkpoint
        uses: actions/upload-artifact@v6
        with:
          name: coral-kernel-${{ github.run_id }}
          path: kernel-checkpoint/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Preserve kernel logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coral-kernel-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: warn
  recovery:
    name: Build recovery with checkpoint kernel
    needs: kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Download completed kernel checkpoint
        uses: actions/download-artifact@v7
        with:
          name: coral-kernel-${{ github.run_id }}
          path: kernel-checkpoint/
      - name: Prepare build host
        run: bash scripts/prepare_host.sh
      - name: Build and validate boot recovery
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
        run: bash scripts/build.sh "$RUNNER_TEMP/orangefox" recovery
      - name: Preserve recovery logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coral-recovery-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: warn
      - name: Upload structurally validated experimental image
        uses: actions/upload-artifact@v6
        with:
          name: OrangeFox-unofficial-coral-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
